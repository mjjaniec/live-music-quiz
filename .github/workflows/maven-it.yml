name: Java CI with Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Check code formatting (Spotless)
      run: ./mvnw -B -ntp spotless:check

    - name: Resolve dependencies for security scan
      run: ./mvnw -B -ntp dependency:copy-dependencies -DoutputDirectory=target/dependency

    - name: Scan dependencies for vulnerabilities (Trivy)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: 'target/dependency'
        scanners: 'vuln'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'

    - name: Install Playwright Browsers
      run: ./mvnw -B -ntp exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

    - name: Run Integration Tests
      run: ./mvnw -B -ntp verify -Pit -Pproduction -DskipTests=false
